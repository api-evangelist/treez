- target: $.components.securitySchemes
  description: Document the authentication scheme the harvested contract omits entirely. Treez publishes
    it in prose at https://code.treez.io/reference/authentication; every one of the seven definitions
    declares an empty securitySchemes, so an agent cannot authenticate from the contract.
  update:
    TreezSelfSignedJWT:
      type: apiKey
      in: header
      name: Authorization
      description: 'Self-signed RSA JWT (RFC 7519), signed with the integrator private key whose public
        key Treez holds against a Certificate ID. Value is base64url(claims) + "." + base64(RSA-SHA256
        signature) - a TWO-part token that omits the JOSE header segment, so standard JWT libraries cannot
        produce it unmodified. Claims: aud (exact endpoint URL), iss (Certificate ID), oid (Organization
        ID), iat and exp in MILLISECONDS, jti recommended. Treez enforces exp = iat + 30000 ms; a TTL
        outside that returns 400. See authentication/treez-authentication.yml.'
      x-standard: RFC 7519 (with deviations)
      x-docs: https://code.treez.io/reference/authentication
