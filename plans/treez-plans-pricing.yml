  statement: >-
    The pricing page lists "POS with unlimited registers, unlimited employees, and API access"
    as included in the platform rather than as a paid add-on. API access is therefore gated by the
    PARTNER programme, not by a price tier: an integrator applies at
    https://www.treez.io/partner-application, signs an MNDA and the API Usage Agreement, builds in
    the sandbox, is certified by Treez, and then a mutual customer requests a production API key on
    the integrator's behalf.
