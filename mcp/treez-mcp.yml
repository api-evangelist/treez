note: >-
  Treez serves a live, anonymous, remote MCP endpoint at https://code.treez.io/mcp on its own
  developer-documentation host. It is the ReadMe-generated documentation MCP server: initialize
  returns serverInfo {"name":"Treez API Documentation","version":"3.1.0"} and tools/list returns
  five tools over the seven published Treez OpenAPI definitions. Four are read-only discovery
  tools; execute-request actually issues the HTTP call described by a HAR request object, so the
  server is a real (if generic) execution surface for the Treez APIs - the caller still has to
  supply their own self-signed JWT in the Authorization header of that HAR request. There is no
  Treez-authored, per-resource MCP server (no npx package, no mcp.treez.io: DNS for
  mcp.treez.io did not resolve).
deployment:
  mode: remote
  endpoint: https://code.treez.io/mcp
  install: null
  package: null
  auth: none
  verified: probed
  auth_note: >-
    tools/list and initialize succeed with no credentials. Calling a Treez API through
    execute-request requires the caller to embed their own self-signed RSA JWT in the HAR
    request's Authorization header; the MCP server holds no Treez credential of its own.
