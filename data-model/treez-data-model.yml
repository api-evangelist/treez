- from: Product
  to: ProductSubCategory
  type: belongs_to
  via: productSubCategoryId
- from: Product
  to: CustomSubCategory
  type: belongs_to
  via: customSubCategoryId
- from: Product
  to: Attribute
  type: has_many
  via: productattribute assignment (catalog-attributes-assign)
- from: Attribute
  to: AttributeCategory
  type: belongs_to
  via: attributeCategoryId
- from: Collection
  to: Product
  type: has_many
  via: productCollectionId
- from: StorePrice
  to: PriceTier
  type: belongs_to
  via: priceTierId
- from: SKU
  to: Image
  type: has_many
  via: imageId
- from: Ticket
  to: Customer
  type: belongs_to
  via: customer_id
- from: Ticket
  to: Product
  type: has_many
  via: items[].product_id
- from: Ticket
  to: Package
  type: has_many
  via: items[].inventory_barcodes / size_id
- from: Ticket
  to: Discount
  type: has_many
  via: discount_ids
- from: Ticket
  to: Location
  type: belongs_to
  via: items[].location_name
- from: Ticket
  to: Ticket
  type: has_many
  via: refund_ticket_ids
