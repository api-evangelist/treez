- from: Ticket
  to: Ticket
  type: belongs_to
  via: original_ticket_id
  note: the inverse of refund_ticket_ids
- from: Customer
  to: Customer
  type: has_many
  via: merged_customer_ids / merged_into_customer_id
  note: customer merge is modelled in the data, not just as an operation
- from: Customer
  to: Customer
  type: has_many
  via: caregiver_customer_id
  note: a caregiver is itself a customer record - a regulatory relationship in medical markets
- from: Package
  to: Product
  type: belongs_to
