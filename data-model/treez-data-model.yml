id_conventions:
  organization_scope_ids: [organizationId, entityId, orgDiscountId, discount_mso_org_id, mso_product_collection_id]
  catalog_ids_camel_case: [productId, variantId, brandId, productCategoryId, productSubCategoryId, customSubCategoryId, attributeCategoryId, priceTierId, tagGroupId, productCollectionId, imageId]
  pos_ids_snake_case: [customer_id, ticket_id, product_id, package_id, batch_id, invoice_id, distributor_id, location_id, discount_id, size_id, employee_id]
  external_system_ids: [external_id, external_ids, external_order_number, external_invoice_id, external_batch_id, state_medical_id, package_label, aiq_contact_id]
  external_id_note: >-
    Treez carries first-class external-id fields on customers, orders, invoices and batches, which
    is what makes two-way sync with an ecommerce, delivery or loyalty partner tractable.
    aiq_contact_id is a named third-party field (Alpine IQ), a rare case of a partner's identifier
    being baked into the contract.
  id_format: >-
    Mostly GUIDs (ticket_id, product_id, package_id). customer_id is an integer in the published
    examples. order_number is a 6-character human-facing code and is NOT interchangeable with
    ticket_id - confusing them returns 400 TICKET_NOT_FOUND.
