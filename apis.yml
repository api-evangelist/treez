    url: openapi/treez-dispensary-openapi.json
  - type: Documentation
    url: https://code.treez.io/reference/treez-api
  - type: APIReference
    url: https://code.treez.io/reference
  - type: Overlay
    url: overlays/treez-dispensary-overlay.yaml
  - type: ErrorCatalog
    url: errors/treez-problem-types.yml
  - type: DataModel
    url: data-model/treez-data-model.yml
  - type: Authentication
    url: authentication/treez-authentication.yml
- name: Treez Catalog Service API
  description: >-
    Organization-level central product catalog spanning every store an organization operates -
    products, SKUs/variants, brands, attributes and attribute categories, global and custom
    subcategories with per-organization exclusions, a three-step pre-signed product image upload,
    price tiers, per-store prices and store (entity) lookup. 34 operations. Scope is carried in
    the JWT oid claim rather than the path.
  humanURL: https://code.treez.io/reference/catalog
  baseURL: https://api-prod.treez.io/service/catalog
  tags:
  - Cannabis
  - Product Catalog
  - Retail
  - E-Commerce
  tags_raw:
