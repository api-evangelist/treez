apis:
- name: Treez Documentation MCP Server
  description: >-
    Live, anonymous, remote MCP endpoint served on Treez's own developer-documentation host. The ReadMe-generated
    documentation server - initialize returns serverInfo "Treez API Documentation" 3.1.0 and tools/list
    returns five tools over the seven published Treez OpenAPI definitions: four read-only discovery tools
    plus execute-request, which issues the described HTTP call. The caller supplies their own self-signed
    JWT; the server holds no Treez credential.
  humanURL: https://code.treez.io/reference
  baseURL: https://code.treez.io/mcp
