apis:
- name: Treez Dispensary API v3
  description: >-
    Per-dispensary POS surface exposing the functionality of an individual Treez retail
    instance - customer records and check-in queue, tickets/orders with a non-committing preview,
    product and stock reads, inventory adjustment/move/merge, lab results, purchase invoices,
    distributors and vendor credits, and METRC package sync for state track-and-trace. 65
    operations. Addressed as /dispensary/v3/{dispensary_name}, where the tenant slug is the
    subdomain of the customer's own <tenant>.treez.io URL.
  humanURL: https://code.treez.io/reference/treez-api
  baseURL: https://api-prod.treez.io/dispensary/v3
  tags:
  - Cannabis
  - Point-of-Sale
  - Dispensary
  - Inventory Management
  - Track and Trace
  - Metrc
  - Customer Data
  tags_raw:
  - Cannabis
  - Point of Sale
  - Dispensary
  - Inventory Management
  - Track and Trace
  - METRC
  - Customer Data
  properties:
