aid: treez
name: Treez
description: >-
  Treez is an enterprise cloud commerce platform for US cannabis retail, providing dispensary
  point-of-sale, retail analytics, cashless payments, ecommerce and loyalty to high-volume
  operators across the largest legal state markets. Its public API surface is a partner-gated REST
  programme documented at code.treez.io and split into two families: per-dispensary Dispensary
  APIs at api-prod.treez.io/dispensary/v3 covering customers, tickets/orders, inventory packages,
  lab results, invoices, distributors and METRC state track-and-trace package sync; and
  organization-level Service APIs at api-prod.treez.io/service covering the central product
  catalog, collections, discounts, tags and JWT validation. A legacy SellTreez v2.0 Product API
  remains published at api.treez.io. Treez serves an RFC 9727 API Catalog naming all seven of its
  OpenAPI definitions, an llms.txt documentation index, and a live anonymous MCP endpoint over
  those definitions. Authentication is a self-signed RSA JWT with a 30-second TTL; access requires
  a partner application, an MNDA and API Usage Agreement, sandbox development and certification
  before a mutual customer can request a production key.
