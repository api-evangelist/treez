- name: Treez Legacy SellTreez v2.0 Product API
  description: >-
    Legacy v2.0 product surface - list products with rich filters, list products by last-updated,
    read a product by id, read product fields by category type, create and update products, and
    upload a product image. 7 operations. Superseded by the v3 dispensary and catalog surfaces but
    still published, still documented under the portal's "Legacy v2 Docs" version selector, and
    still named in the RFC 9727 API Catalog. Uses the older client-ID plus per-location API key
    Authorization API rather than the v3 self-signed JWT.
  humanURL: https://code.treez.io/docs/available-endpoints
  baseURL: https://api.treez.io/v2.0/dispensary
  tags:
  - Cannabis
  - Product Catalog
  - Point-of-Sale
  tags_raw:
  - Cannabis
  - Product Catalog
  - Point of Sale
  properties:
  - type: OpenAPI
    url: openapi/treez-product-api-openapi.json
  - type: Documentation
    url: https://code.treez.io/docs/available-endpoints
  - type: Authentication
    url: authentication/treez-authentication.yml
  - type: Overlay
    url: overlays/treez-product-api-overlay.yaml
- name: Treez Documentation MCP Server
  description: >-
    Live, anonymous, remote MCP endpoint served on Treez's own developer-documentation host. The
    ReadMe-generated documentation server - initialize returns serverInfo "Treez API
    Documentation" 3.1.0 and tools/list returns five tools over the seven published Treez OpenAPI
    definitions: four read-only discovery tools plus execute-request, which issues the described
    HTTP call. The caller supplies their own self-signed JWT; the server holds no Treez credential.
  humanURL: https://code.treez.io/reference
  baseURL: https://code.treez.io/mcp
  tags:
  - MCP
  - agent-native
  - Cannabis
  properties:
  - type: MCPServer
    url: mcp/treez-mcp.yml
  - type: MCPServer
    url: https://code.treez.io/mcp
  - type: ToolCrosswalk
    url: mcp/treez-tool-crosswalk.yml
