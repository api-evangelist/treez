onboarding_lifecycle:
  stages:
  - submit partner application (https://www.treez.io/partner-application)
  - sign MNDA and API Usage Agreement (https://code.treez.io/page/legal)
  - build against the partner sandbox
  - provide proof of support resources and documentation
  - complete the partner survey
  - certification by Treez
  - mutual customer requests a production API key on the partner's behalf
  note: >-
    Certification is a real gate with a published technical criterion: Treez will refuse to
    certify an integration that calls the legacy Authorization API more often than its 2-hour
    token life requires.
