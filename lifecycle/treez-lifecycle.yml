status_page:
  published: false
  note: >-
    No Treez status page was found. status.treez.io resolves and returns HTTP 200, but it is a
    CUSTOMER TENANT - the page title is "Status Dispensary - Adelanto", i.e. a dispensary named
    "Status" on the standard <tenant>.treez.io pattern, not a service-health page. treez.statuspage.io
    redirects to Atlassian's product marketing page, which means no Statuspage tenant exists.
    Recorded here so a later pass does not mistake the tenant for a status page.
