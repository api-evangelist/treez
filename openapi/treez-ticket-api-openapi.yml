  /{dispensary}/ticket/status/{order_status}/page/{page}/pagesize/{pagesize}:
    get:
      summary: Get by status
      description: Lookup tickets by their current status
      operationId: ticket-get-by-status
      parameters:
      - name: dispensary
        in: path
        schema:
          type: string
        required: true
      - name: full_decimals
        in: query
        description: Shows un-rounded decimals on all dollar values when applicable.
        schema:
          type: boolean
      - name: order_status
        in: path
        schema:
          type: string
          enum:
          - PREVIEW
          - VERIFICATION_PENDING
          - AWAITING_PROCESSING
          - IN_PROCESS
          - PACKED_READY
          - OUT_FOR_DELIVERY
          - COMPLETED
          - CANCELED
          - REMOVED
        required: true
      - name: page
        in: path
        schema:
          type: string
        required: true
      - name: pagesize
        in: path
        schema:
          type: string
        required: true
