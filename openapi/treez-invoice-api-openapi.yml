      operationId: payment-terms-get-all-1
      parameters:
      - in: path
        name: dispensary
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    resultCode: SUCCESS
                    resultReason: null
                    resultDetail: null
                    data:
                      id: 9791f7aa-dcaf-42db-b0e4-e169166802d0
                      label: Net 60
                      payment_due: Net 60
              schema:
                type: object
                properties:
                  resultCode:
                    type: string
                    example: SUCCESS
                  resultReason: {}
                  resultDetail: {}
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 9791f7aa-dcaf-42db-b0e4-e169166802d0
                      label:
                        type: string
                        example: Net 120
                      payment_due:
                        type: string
                        example: Net 120
        '400':
          description: '400'
          content:
            application/json:
              examples:
                INCORRECT_VALUE:
                  summary: INCORRECT_VALUE
                  value:
                    resultCode: FAIL
                    resultReason: INCORRECT_VALUE
                    resultDetail:
                    - 'label: Label cannot be blank or empty'
                    - 'paymentDue: Payment Due cannot be blank or empty'
                INVALID_REQUEST:
                  value:
                    resultCode: FAIL
                    resultReason: INVALID_REQUEST
                    resultDetail: Payment terms with the specified label already exist.
                    data: null
                  summary: INVALID_REQUEST
              schema:
                type: object
                properties:
                  resultCode:
                    type: string
                    example: FAIL
                  resultReason:
                    type: string
                    example: INVALID_REQUEST
                  resultDetail:
                    type: string
                    example: Payment terms with the specified label already exist.
                  data: {}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                payment_due:
                  type: integer
              required:
              - label
              - payment_due
      tags:
      - Invoice
