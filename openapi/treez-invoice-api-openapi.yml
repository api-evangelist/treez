openapi: 3.2.0
info:
  title: dispensary Invoice API
  version: 3.1.0
servers:
- url: https://api-prod.treez.io/dispensary/v3
security:
- {}
tags:
- name: Invoice
paths:
  /{dispensary}/invoice/credit/create:
    post:
      summary: Distributor Credit - Create
      description: Create a new vendor credit that can be applied to an invoice. This endpoint only creates the credit - it does not apply it to a specific invoice.
      operationId: invoice-apply-credit-1
      parameters:
      - in: path
        name: dispensary
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - amount
              properties:
                id:
                  type: string
                  description: The `id` of the distributor for which the credit is being created
                amount:
                  type: number
                  description: The dollar amount of the credit
                notes:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"resultCode\": \"SUCCESS\",\n    \"resultReason\": null,\n    \"resultDetail\": null,\n    \"data\": {\n        \"id\": \"5f33d387-8f7c-4068-bd48-b920a5efd267\",\n        \"payment_status\": \"PARTIALLY PAID\",\n        \"payments\": [\n            {\n                \"payment_date\": \"2025-12-11T15:00:17.175-0800\",\n                \"payment_user\": \"API\",\n                \"payment_amount\": 50.00,\n                \"transaction_type\": \"Credit Note\",\n                \"payment_source\": \"N/A\",\n                \"payment_notes\": \"Distributor credit applied\"\n            }\n        ]\n    }\n}"
              schema:
                type: object
                properties:
                  resultCode:
                    type: string
                    example: SUCCESS
                  resultReason:
                    type: string
                  resultDetail:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 5f33d387-8f7c-4068-bd48-b920a5efd267
                      payment_status:
                        type: string
                        example: PARTIALLY PAID
                      payments:
                        type: array
                        items:
                          type: object
                          properties:
                            payment_date:
                              type: string
                              example: 2025-12-11T15:00:17.175-0800
                            payment_user:
                              type: string
                              example: API
                            payment_amount:
                              type: integer
                              example: 50
                              default: 0
                            transaction_type:
                              type: string
                              example: Credit Note
                            payment_source:
                              type: string
                              example: N/A
                            payment_notes:
                              type: string
                              example: Distributor credit applied
        '400':
          description: '400'
          content:
            application/json:
              examples:
                INCORRECT_VALUE:
                  value: "{\n    \"resultCode\": \"FAIL\",\n    \"resultReason\": \"INCORRECT_VALUE\",\n    \"resultDetail\": [\n        \"status: Status cannot be blank or empty\"\n    ]\n}"
              schema:
                type: object
                properties:
                  resultCode:
                    type: string
                    example: FAIL
                  resultReason:
                    type: string
                    example: INCORRECT_VALUE
                  resultDetail:
                    type: array
                    items:
                      type: string
                      example: 'status: Status cannot be blank or empty'
      x-internal: false
      tags:
      - Invoice
  /{dispensary}/invoice/credit/apply:
    post:
      summary: Distributor Credit - Apply to Invoice
      description: Apply an existing vendor credit as payment toward an invoice.
      operationId: invoice-apply-credit
      parameters:
      - in: path
        name: dispensary
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - distributor_id
              - payment_amount
              properties:
                id:
                  type: string
                  description: The `id` of the invoice to which the payment will be applied.
                distributor_id:
                  type: string
                payment_amount:
                  type: string
                payment_notes:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"resultCode\": \"SUCCESS\",\n    \"resultReason\": null,\n    \"resultDetail\": null,\n    \"data\": {\n        \"id\": \"5f33d387-8f7c-4068-bd48-b920a5efd267\",\n        \"payment_status\": \"PARTIALLY PAID\",\n        \"payments\": [\n            {\n                \"payment_date\": \"2025-12-11T15:00:17.175-0800\",\n                \"payment_user\": \"API\",\n                \"payment_amount\": 50.00,\n                \"transaction_type\": \"Credit Note\",\n                \"payment_source\": \"N/A\",\n                \"payment_notes\": \"Distributor credit applied\"\n            }\n        ]\n    }\n}"
              schema:
                type: object
                properties:
                  resultCode:
                    type: string
                    example: SUCCESS
                  resultReason:
                    type: string
                  resultDetail:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 5f33d387-8f7c-4068-bd48-b920a5efd267
                      payment_status:
                        type: string
                        example: PARTIALLY PAID
                      payments:
                        type: array
                        items:
                          type: object
                          properties:
                            payment_date:
                              type: string
                              example: 2025-12-11T15:00:17.175-0800
                            payment_user:
                              type: string
                              example: API
                            payment_amount:
                              type: integer
                              example: 50
                              default: 0
                            transaction_type:
                              type: string
                              example: Credit Note
                            payment_source:
                              type: string
                              example: N/A
                            payment_notes:
                              type: string
                              example: Distributor credit applied
        '400':
          description: '400'
          content:
            application/json:
              examples:
                INCORRECT_VALUE:
                  value: "{\n    \"resultCode\": \"FAIL\",\n    \"resultReason\": \"INCORRECT_VALUE\",\n    \"resultDetail\": [\n        \"status: Status cannot be blank or empty\"\n    ]\n}"
              schema:
                type: object
                properties:
                  resultCode:
                    type: string
                    example: FAIL
                  resultReason:
                    type: string
                    example: INCORRECT_VALUE
                  resultDetail:
                    type: array
                    items:
                      type: string
                      example: 'status: Status cannot be blank or empty'
      x-internal: false
      tags:
      - Invoice
