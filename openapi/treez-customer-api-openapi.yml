          application/json:
            schema:
              type: object
              properties:
                file_name:
                  type: string
                  description: The file name to be saved.
                file_type:
                  type: string
                  enum:
                  - misc_upload
                  - doctor_permit
                  - membership_agreement
                  - drivers_license
                encoded_string:
                  type: string
                  description: The file in base64 encoded format
              required:
              - file_name
              - file_type
              - encoded_string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"resultCode\": \"SUCCESS\",\n    \"resultReason\": null,\n    \"resultDetail\": null,\n    \"data\": null\n}"
              schema:
                type: object
                properties:
                  resultCode:
                    type: string
                    example: SUCCESS
                  resultReason: {}
                  resultDetail: {}
                  data: {}
