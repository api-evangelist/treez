  /{dispensary}/customer/update/{customer_id}:
    patch:
      summary: Update customer
      description: ''
      operationId: dispensary-customer-update
      parameters:
      - name: dispensary
        in: path
        description: The dispensary short name
        schema:
          type: string
          default: partnersandbox3
        required: true
      - name: customer_id
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - first_name
              - last_name
              - birthday
              - patient_type
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                birthday:
                  type: string
                  description: 'Format: YYYY-MM-DD'
                patient_type:
                  type: string
                  description: If MEDICAL_MMID is specified, then `state_medical_id` and `permit_expiration` are required.
                  enum:
                  - ADULT
                  - MEDICAL
                  - MEDICAL_MMID
                email:
                  type: string
                phone:
                  type: string
                  description: 10 digits, no dashes
                notes:
                  type: string
                gender:
                  type: string
                  description: Male, Female, Unspecified, Non-Binary
                  enum:
                  - M
                  - F
                  - U
                  - N
                addresses:
                  type: array
                  items:
                    properties:
                      type:
                        type: string
                        description: '*Required if any other value in the address field is populated'
                        enum:
                        - ADDRESS_OF_RECORD
                        - ALTERNATIVE_ADDRESS
                        - SECONDARY_ADDRESS
                      street1:
                        type: string
                        description: '*Required if any other value in the address field is populated'
                      street2:
                        type: string
                      city:
                        type: string
                        description: '*Required if any other value in the address field is populated'
                      state:
                        type: string
                        description: '*Required if any other value in the address field is populated'
