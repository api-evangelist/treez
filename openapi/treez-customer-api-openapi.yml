  /{dispensary}/customer/detailcustomer:
    post:
      summary: Create customer
      description: ''
      operationId: dispensary-customer-create
      parameters:
      - name: dispensary
        in: path
        description: The dispensary short name
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - first_name
              - last_name
              - birthday
              - patient_type
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                birthday:
                  type: string
                  description: 'Format: YYYY-MM-DD'
                patient_type:
                  type: string
                  description: If MEDICAL_MMID is specified, then `state_medical_id` and `permit_expiration` are required.
                  enum:
                  - ADULT
                  - MEDICAL
                  - MEDICAL_MMID
                email:
                  type: string
                phone:
                  type: string
                  description: 10 digits, no dashes
                notes:
                  type: string
                gender:
                  type: string
                  description: Male, Female, Unspecified, Non-Binary
                  enum:
                  - M
                  - F
                  - U
                  - N
                addresses:
                  type: array
                  items:
                    properties:
                      type:
                        type: string
                        description: '*Required if any other value in the address field is populated'
                        enum:
                        - ADDRESS_OF_RECORD
                        - ALTERNATIVE_ADDRESS
                        - SECONDARY_ADDRESS
                      street1:
                        type: string
                        description: '*Required if any other value in the address field is populated'
                      street2:
                        type: string
                      city:
                        type: string
                        description: '*Required if any other value in the address field is populated'
                      state:
                        type: string
                        description: '*Required if any other value in the address field is populated'
                      primary:
                        type: boolean
                        description: Specifies whether the entry is the primary address for delivery. Default behavior is `true` if not specified.
                      zipcode:
                        type: string
                        description: '*Required if any other value in the address field is populated'
                    type: object
                middle_name:
                  type: string
                drivers_license:
                  type: string
                  description: Driver's license or other ID number
                is_caregiver:
                  type: boolean
                  description: Indicator whether the customer record being created is a caregiver for a medical patient. Default behavior is false if not specified.
                caregiver_license_number:
                  type: string
                  description: The caregiver's state issued license number. Include if `is_caregiver = true`
                caregiver_details:
                  type: array
                  items:
                    properties:
                      caregiver_customer_id:
                        type: string
                        description: Optional when creating a medical patient record. This refers to the customer_id of the caregiver if their record has been previously created.
                    type: object
                  description: Add up to 2 caregivers
                state_medical_id:
                  type: string
                  description: The customer’s state issued medical id number (medical patients only).
                permit_expiration:
                  type: string
                  description: 'Format: YYYY-MM-DD. The expiration date of the customer''s state medical id.'
                physician_first_name:
                  type: string
                  description: First name of the customer's recommending physician.
                physician_last_name:
                  type: string
                  description: Last name of the customer's recommending physician.
                physician_license:
                  type: string
                  description: License number of the customer's recommending physician.
                physician_phone:
                  type: string
                  description: 10 digits, no dashes
                caregiver_name_1:
                  type: string
                  description: Full name of the customer's primary caregiver.
                caregiver_name_2:
                  type: string
                  description: Full name of the customer's secondary caregiver.
                rewards_balance:
                  type: integer
                  format: int32
                opt_out:
                  type: boolean
                  description: The customer's consent status for receiving marketing. Default behavior is `false` if not specified.
                referral_source:
                  type: string
                  description: How the customer found out about the dispensary. These are the default values and can be updated by the dispensary.
                  enum:
                  - WEEDMAPS
                  - CULTURE
                  - YELP
                  - FACEBOOK
                  - INSTAGRAM
                  - TWITTER
                  - GOOGLE
                  - ADVERTISEMENT
                  - WORD OF MOUTH
                  - LEAFLY
                  - WALKING-BY
                  - FRIEND / FAMILY
                  - OTHER
                warning_1:
                  type: boolean
                  description: Indicates whether the customer has received the first warning. Default behavior is `false` if not specified.
                warning_2:
                  type: boolean
                  description: Indicates whether the customer has received the second warning. Default behavior is `false` if not specified.
                banned:
                  type: boolean
                  description: Indicator of whether the customer has been banned from the dispensary. Default behavior is `false` if not specified.
                customer_groups:
                  type: array
                  items:
                    type: string
