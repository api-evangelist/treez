                  description: The `id` GUID of the product to be updated.
                brandId:
                  type: string
                  description: The `id` GUID of the brand
                name:
                  type: string
                  description: The product name
                productSubCategoryId:
                  type: string
                  description: The `id` GUID of the product subcategory
                status:
                  type: string
                  enum:
                  - active
                  - inactive
                referenceIds:
