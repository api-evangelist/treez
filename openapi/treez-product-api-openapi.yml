                              Our 1:1 transdermal patch has equal parts CBD and THC and is great for relieving body aches and relaxing the mind. Transdermal patches are fast acting and continuously release cannabinoids into the bloodstream, offering up to 12 hours of relief. This patch can produce a light high and is recommended for those with some THC experience. Crafted with skin-soothing ingredients like jojoba and avocado oil, these patches are perfect for those looking for a slow-release, easy-to-apply and single use application solution. Apply the patch to aching areas to relieve targeted pain. Apply it to the wrist or neck for whole-body relief. Make sure the skin is clean, dry and free of hair before applying. Apply Releaf Patches to areas with prominent veins to improve transdermal efficacy, such as the backs of knees or inside of wrists. Use Releaf Patches for discreet, extended relief throughout the day. To alleviate pain in specific areas like shoulders or head, apply the Releaf Patch at the back of the neck.'
