                      strain: null
                      pricingMethod: FLAT
                      priceTierId: null
                      targetMergedProductId: null
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 364c0e4b-cdc8-4e53-8ce6-6ab66bb72b62
