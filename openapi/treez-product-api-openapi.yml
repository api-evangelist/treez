  /{dispensary}/product/product_list/lastUpdated/after/{last_updated_at}:
    get:
      summary: Get by updated date
      description: Returns a list of products that have been modified after the specified date.
      operationId: dispensary-product-get-by-updated-date
      parameters:
      - name: dispensary
        in: path
        schema:
          type: string
        required: true
      - name: pagesize
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: last_updated_at
        in: path
        description: 'ISO 8601: `YYYY-MM-DDThh:mm:ss.sss±hh:mm`'
        schema:
          type: string
          format: date
        required: true
      - name: active
        in: query
        description: Default behavior returns `TRUE` if not specified.
        schema:
          type: string
          enum:
          - 'TRUE'
          - 'FALSE'
          - ALL
      - name: category_type
        in: query
        description: Default behavior returns all if not specified.
        schema:
          type: string
          enum:
          - BEVERAGE
          - CARTRIDGE
          - EDIBLE
          - EXTRACT
          - FLOWER
          - MERCH
          - MISC
          - NON-INV
          - PILL
          - PLANT
          - PREROLL
          - TINCTURE
          - TOPICAL
