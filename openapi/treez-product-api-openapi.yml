le-plant, solventless cannabis oil, and are made with our signature solventless, chemical-free infusion process to preserve the plant’s full spectrum of cannabinoids, terpenes and phytonutrients for maximum therapeutic benefits. Our patches are hypoallergenic and water-resistant with a stronger adhesive to help prevent leakage.\\n\\nOur 1:1 transdermal patch has equal parts CBD and THC and is great for relieving body aches and relaxing the mind. Transdermal patches are fast acting and continuously release cannabinoids into the bloodstream, offering up to 12 hours of relief. This patch can produce a light high and is recommended for those with some THC experience. Crafted with skin-soothing ingredients like jojoba and avocado oil, these patches are perfect for those looking for a slow-release, easy-to-apply and single use application solution. Apply the patch to aching areas to relieve targeted pain. Apply it to the wrist or neck for whole-body relief. Make sure the skin is clean, dry and free of hair before applying. Apply Releaf Patches to areas with prominent veins to improve transdermal efficacy, such as the backs of knees or inside of wrists. Use Releaf Patches for discreet, extended relief throughout the day. To alleviate pain in specific areas like shoulders or head, apply the Releaf Patch at the back of the neck.\",\n            \"minimum_visible_inventory_level\": 4,\n            \"hide_from_menu\": false\n        },\n        \"autoupdate_lab_results\": true,\n        \"lab_results\": [\n            {\n                \"result_type\": \"CBD\",\n                \"amount\": {\n                    \"minimum_value\": \"10\",\n                    \"maximum_value\": \"10\"\n                },\n                \"amount_type\": \"PERCENTAGE\"\n            },\n            {\n                \"result_type\": \"THC\",\n                \"amount\": {\n                    \"minimum_value\": \"50\",\n                    \"maximum_value\": \"50\"\n                },\n      