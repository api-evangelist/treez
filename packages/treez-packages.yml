source: >-
  Registry searches on 2026-08-30 against registry.npmjs.org, pypi.org, rubygems.org,
  packagist.org and crates.io, plus a full read of the provider's own documentation index
  (https://code.treez.io/llms.txt, 135 pages) and its API reference. No SourceCode, SDK or CLI
  link exists in apis.yml to derive candidates from.
sdk_count: 0
official_sdks: 0
note: >-
  Treez publishes no first-party client libraries in any package registry, and its documentation
  offers none. Every registry hit for "treez" belongs to somebody else and is recorded below so a
  later pass does not mistake one for a Treez SDK. What Treez does hand integrators instead are
  two downloadable Postman collections and hand-written signing examples in five languages
  (Node.js, Java, Ruby, Go and a shell/OpenSSL snippet) embedded in the authentication page - real
  onboarding material, but copy-paste code, not versioned, installable, maintainable packages. For
  an API whose auth scheme is a hand-rolled two-part RSA-signed token that standard JWT libraries
  cannot produce, the absence of a signing SDK pushes a genuinely fiddly cryptographic step onto
  every integrator.
