published_ceilings:
  note: >-
    These are hard REQUEST-SIZE caps Treez does publish. They are not rate limits - they bound one
    call, not a rate - but they are the only quantified ceilings in the documentation, and
    exceeding them returns 400 RESPONSE_LIMIT_EXCEEDS rather than 429.
  items:
