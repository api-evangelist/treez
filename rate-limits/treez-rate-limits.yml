behavioural_limits:
  note: >-
    Treez enforces a call-frequency expectation contractually rather than at runtime, on the
    legacy v2 surface only.
  items:
  - surface: legacy v2 Authorization API
    rule: >-
      Access tokens are valid for 2 hours; partners are required to call the Authorization API
      only when their token expires or shortly before. Treez states it will not certify an
      integration that does not use the Authorization API "in an optimized and efficient manner".
    enforcement: certification gate (human), not an HTTP status
    source: https://code.treez.io/docs/authorization-2
  - surface: v3 self-signed JWT
    rule: >-
      Each request carries its own freshly-signed JWT with a 30,000 ms TTL, so there is no token
      endpoint to over-call on v3 - the auth cost moved into the client.
    source: https://code.treez.io/reference/authentication
